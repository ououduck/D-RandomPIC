name: Build and Deploy to Cloudflare Pages

# 触发条件：每次提交（push）后自动执行
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # 运行初始化脚本，生成包含构建好的图片的 dist/ 文件夹
      # 注意：仓库中实际的脚本文件名为 gen_pic.py（而非 get_pic.py）
      - name: Generate random image files
        run: python gen_pic.py

      # 将 dist/ 文件夹部署到 Cloudflare Pages（使用 wrangler CLI）
      # 若你的 Pages 项目名不是 d-randompic，请在仓库 Variables 中
      # 配置 CLOUDFLARE_PROJECT_NAME，或直接修改下方默认值
      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler pages deploy dist --project-name="${{ vars.CLOUDFLARE_PROJECT_NAME || 'd-randompic' }}" --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
